
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #1e40af;
    color: white;
    padding: 22px 16px;
    text-align: center;
}

header h1 {
    margin: 0 0 8px;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat-card, .panel {
    background: white;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 2px 8px #00000010;
}

.stat-card h2 {
    color: #1d4ed8;
    margin: 8px 0 0;
}

.panel {
    margin-bottom: 20px;
}

h2 {
    font-size: 20px;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 7px 0 14px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font-size: 15px;
}

label {
    font-weight: bold;
    font-size: 14px;
}

button {
    border: none;
    padding: 11px 15px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
    margin: 3px;
}

.primary {
    background: #2563eb;
    color: white;
}

.secondary {
    background: #64748b;
    color: white;
}

.danger {
    background: #dc2626;
    color: white;
}

.edit {
    background: #eab308;
    color: #422006;
}

.search {
    margin-bottom: 12px;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #e2e8f0;
}

th {
    background: #eff6ff;
}

.empty {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

.message {
    margin: 10px 0;
    font-weight: bold;
    color: #15803d;
}

footer {
    text-align: center;
    padding: 20px;
    color: #64748b;
    font-size: 13px;
}

@media (max-width: 600px) {
    .stats {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 12px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Student Management System</h1>
    <p>Manage Student Information and Academic Records</p>
</header>

<div class="container">

    <section class="stats">
        <div class="stat-card">
            <p>Total Students</p>
            <h2 id="totalStudents">0</h2>
        </div>

        <div class="stat-card">
            <p>College Students</p>
            <h2 id="collegeCount">0</h2>
        </div>

        <div class="stat-card">
            <p>Senior High Students</p>
            <h2 id="seniorCount">0</h2>
        </div>
    </section>

    <section class="panel">
        <h2 id="formTitle">Add New Student</h2>

        <form id="studentForm">

            <label>Student ID</label>
            <input id="studentId" type="text"
                   placeholder="Example: 2026-001" required>

            <label>Full Name</label>
            <input id="studentName" type="text"
                   placeholder="Enter full name" required>

            <label>Student Type</label>
            <select id="studentType">
                <option value="College">College</option>
                <option value="Senior High">Senior High School</option>
            </select>

            <label>Course / Strand</label>
            <input id="course" type="text"
                   placeholder="Example: BSIT or STEM" required>

            <label>Year Level</label>
            <select id="yearLevel">
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
                <option value="Grade 11">Grade 11</option>
                <option value="Grade 12">Grade 12</option>
            </select>

            <label>Grade (0-100)</label>
            <input id="grade" type="number"
                   min="0" max="100" step="0.01"
                   placeholder="Enter grade" required>

            <button class="primary" type="submit"
                    id="submitButton">Add Student</button>

            <button class="secondary" type="button"
                    id="cancelButton" hidden>Cancel Edit</button>

        </form>

        <div id="message" class="message"></div>
    </section>

    <section class="panel">
        <h2>Student Records</h2>

        <input class="search" id="searchInput"
               type="text"
               placeholder="Search by name, ID, or course...">

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Course / Strand</th>
                        <th>Year</th>
                        <th>Grade</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentList"></tbody>
            </table>
        </div>

        <h3 id="averageGrade">Average Grade: 0.00</h3>
    </section>

</div>

<footer>
    Student Management System | OOP Final Project
</footer>

<script>

// =====================================
// 1. ABSTRACTION
// =====================================

class Person {

    #name;

    constructor(name) {
        if (new.target === Person) {
            throw new Error("Person is an abstract class.");
        }

        this.#name = name;
    }

    get name() {
        return this.#name;
    }

    set name(value) {
        if (!value.trim()) {
            throw new Error("Name cannot be empty.");
        }

        this.#name = value;
    }

    getRole() {
        throw new Error("Child class must implement getRole().");
    }
}


// =====================================
// 2. INHERITANCE
// =====================================

class Student extends Person {

    #studentId;
    #course;
    #yearLevel;
    #grade;

    constructor(id, name, course, year, grade) {
        super(name);

        this.#studentId = id;
        this.#course = course;
        this.#yearLevel = year;
        this.#grade = Number(grade);
    }

    // ENCAPSULATION: Getters and setters

    get studentId() {
        return this.#studentId;
    }

    get course() {
        return this.#course;
    }

    set course(value) {
        this.#course = value;
    }

    get yearLevel() {
        return this.#yearLevel;
    }

    set yearLevel(value) {
        this.#yearLevel = value;
    }

    get grade() {
        return this.#grade;
    }

    set grade(value) {
        const number = Number(value);

        if (!Number.isFinite(number) ||
            number < 0 || number > 100) {
            throw new Error("Grade must be between 0 and 100.");
        }

        this.#grade = number;
    }

    getRole() {
        return "Student";
    }

    getDetails() {
        return this.name;
    }
}


// =====================================
// 3. POLYMORPHISM
// =====================================

class CollegeStudent extends Student {

    constructor(id, name, course, year, grade) {
        super(id, name, course, year, grade);
    }

    getRole() {
        return "College";
    }
}

class SeniorHighStudent extends Student {

    constructor(id, name, course, year, grade) {
        super(id, name, course, year, grade);
    }

    getRole() {
        return "Senior High";
    }
}


// =====================================
// 4. APPLICATION MANAGEMENT
// =====================================

class StudentManager {

    #students = [];

    constructor() {
        this.loadStudents();
    }

    addStudent(student) {
        if (this.#students.some(
            s => s.studentId === student.studentId
        )) {
            throw new Error("Student ID already exists.");
        }

        this.#students.push(student);
        this.saveStudents();
    }

    getStudents() {
        return [...this.#students];
    }

    findStudent(id) {
        return this.#students.find(
            student => student.studentId === id
        );
    }

    updateStudent(id, updatedData) {
        const student = this.findStudent(id);

        if (!student) {
            throw new Error("Student not found.");
        }

        student.name = updatedData.name;
        student.course = updatedData.course;
        student.yearLevel = updatedData.yearLevel;
        student.grade = updatedData.grade;

        this.saveStudents();
    }

    deleteStudent(id) {
        this.#students = this.#students.filter(
            student => student.studentId !== id
        );

        this.saveStudents();
    }

    getAverageGrade() {
        if (this.#students.length === 0) return 0;

        const total = this.#students.reduce(
            (sum, student) => sum + student.grade, 0
        );

        return total / this.#students.length;
    }

    saveStudents() {
        localStorage.setItem(
            "students",
            JSON.stringify(
                this.#students.map(s => ({
                    id: s.studentId,
                    name: s.name,
                    type: s.getRole(),
                    course: s.course,
                    year: s.yearLevel,
                    grade: s.grade
                }))
            )
        );
    }

    loadStudents() {
        const saved = JSON.parse(
            localStorage.getItem("students") || "[]"
        );

        this.#students = saved.map(data => {
            if (data.type === "College") {
                return new CollegeStudent(
                    data.id, data.name, data.course,
                    data.year, data.grade
                );
            }

            return new SeniorHighStudent(
                data.id, data.name, data.course,
                data.year, data.grade
            );
        });
    }
}


// =====================================
// 5. CONNECT APPLICATION TO WEBSITE
// =====================================

const manager = new StudentManager();

const form = document.getElementById("studentForm");
const studentList = document.getElementById("studentList");
const searchInput = document.getElementById("searchInput");
const message = document.getElementById("message");

let editingId = null;


// Create correct student object

function createStudent(id, name, type, course, year, grade) {

    if (type === "College") {
        return new CollegeStudent(
            id, name, course, year, grade
        );
    }

    return new SeniorHighStudent(
        id, name, course, year, grade
    );
}


// Display student records

function displayStudents(search = "") {

    const students = manager.getStudents();

    const filtered = students.filter(student =>
        student.name.toLowerCase().includes(search.toLowerCase()) ||
        student.studentId.toLowerCase().includes(search.toLowerCase()) ||
        student.course.toLowerCase().includes(search.toLowerCase())
    );

    studentList.innerHTML = "";

    if (filtered.length === 0) {
        studentList.innerHTML =
            '<tr><td colspan="7" class="empty">No students found.</td></tr>';
    }

    filtered.forEach(student => {

        const row = document.createElement("tr");

        const values = [
            student.studentId,
            student.name,
            student.getRole(),
            student.course,
            student.yearLevel,
            student.grade.toFixed(2)
        ];

        values.forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
        });

        const actions = document.createElement("td");

        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.className = "edit";
        editButton.onclick = () => editStudent(student.studentId);

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "danger";
        deleteButton.onclick = () => deleteStudent(student.studentId);

        actions.appendChild(editButton);
        actions.appendChild(deleteButton);
        row.appendChild(actions);

        studentList.appendChild(row);
    });

    updateStatistics();
}


// Update dashboard

function updateStatistics() {

    const students = manager.getStudents();

    document.getElementById("totalStudents").textContent =
        students.length;

    document.getElementById("collegeCount").textContent =
        students.filter(s => s.getRole() === "College").length;

    document.getElementById("seniorCount").textContent =
        students.filter(s => s.getRole() === "Senior High").length;

    document.getElementById("averageGrade").textContent =
        "Average Grade: " + manager.getAverageGrade().toFixed(2);
}


// Add or update student

form.addEventListener("submit", function(event) {

    event.preventDefault();

    try {

        const id = document.getElementById("studentId").value.trim();
        const name = document.getElementById("studentName").value.trim();
        const type = document.getElementById("studentType").value;
        const course = document.getElementById("course").value.trim();
        const year = document.getElementById("yearLevel").value;
        const grade = Number(document.getElementById("grade").value);

        if (!id || !name || !course) {
            throw new Error("Please complete all fields.");
        }

        if (!Number.isFinite(grade) || grade < 0 || grade > 100) {
            throw new Error("Grade must be between 0 and 100.");
        }

        if (editingId) {

            manager.updateStudent(editingId, {
                name, course, year, grade
            });

            message.textContent = "Student updated successfully!";

        } else {

            const student = createStudent(
                id, name, type, course, year, grade
            );

            manager.addStudent(student);

            message.textContent = "Student added successfully!";
        }

        resetForm();
        displayStudents(searchInput.value);

    } catch (error) {

        message.textContent = error.message;
        message.style.color = "#dc2626";
    }
});


// Edit student

function editStudent(id) {

    const student = manager.findStudent(id);

    if (!student) return;

    editingId = id;

    document.getElementById("studentId").value = student.studentId;
    document.getElementById("studentId").disabled = true;

    document.getElementById("studentName").value = student.name;
    document.getElementById("studentType").value = student.getRole();
    document.getElementById("course").value = student.course;
    document.getElementById("yearLevel").value = student.yearLevel;
    document.getElementById("grade").value = student.grade;

    document.getElementById("formTitle").textContent = "Edit Student";
    document.getElementById("submitButton").textContent = "Update Student";
    document.getElementById("cancelButton").hidden = false;

    window.scrollTo({ top: 0, behavior: "smooth" });
}


// Delete student

function deleteStudent(id) {

    if (confirm("Are you sure you want to delete this student?")) {

        manager.deleteStudent(id);

        message.textContent = "Student deleted successfully!";
        message.style.color = "#15803d";

        displayStudents(searchInput.value);
    }
}


// Reset form

function resetForm() {

    form.reset();

    editingId = null;

    document.getElementById("studentId").disabled = false;
    document.getElementById("formTitle").textContent = "Add New Student";
    document.getElementById("submitButton").textContent = "Add Student";
    document.getElementById("cancelButton").hidden = true;
}


// Cancel editing

document.getElementById("cancelButton").addEventListener(
    "click", resetForm
);


// Search students

searchInput.addEventListener("input", function() {
    displayStudents(this.value);
});


// Start application

displayStudents();

</script>

</body>
</html>
